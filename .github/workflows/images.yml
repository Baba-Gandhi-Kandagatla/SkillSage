name: Pushing updated images onto Docker Hub

on:
  push:
    branches:
      - main
      - testing
      - final

jobs:
  build_images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: ${{ github.ref }} 

      - name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
      
      - name: Show branch information
        run: echo "Building images from branch ${{ env.BRANCH_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            bharadwajreddy1406/skillsage-frontend:latest
            bharadwajreddy1406/skillsage-frontend:${{ env.BRANCH_NAME }}

      - name: Build and push backend image
        uses: docker/build-push-action@v2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            bharadwajreddy1406/skillsage-backend:latest
            bharadwajreddy1406/skillsage-backend:${{ env.BRANCH_NAME }}