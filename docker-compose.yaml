version: '3.8'

services:
  frontend:
    image: bharadwajreddy1406/skillsage-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1 
    depends_on:
      - backend

  backend:
    image: bharadwajreddy1406/skillsage-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FRONTEND_URL=frontend
      # - DB_USER=postgres
      # - DB_PASSWORD=Kushal@456
      # - DB_HOST=postgres-db  
      # - DB_NAME=SkillSage
      # - DB_PORT=5432
      - DATABASE_ONLINE=true
      - PGHOST=ep-cold-shadow-a10ok2yv-pooler.ap-southeast-1.aws.neon.tech
      - PGDATABASE=neondb
      - PGUSER=neondb_owner
      - PGPASSWORD=replace-with-database-password
      - OPEN_AI_SECRET=replace-with-openai-key
      - GROQ_API_KEY=replace-with-groq-key
      - COOKIE_NAME=auth_token
      - COOKIE_SECRET=replace-with-cookie-secret
      - JWT_SECRET=replace-with-jwt-secret
      - O1_KEY0=replace-with-github-token
    restart: always 
