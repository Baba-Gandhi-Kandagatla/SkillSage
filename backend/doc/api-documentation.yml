          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "8"
                  name:
                    type: string
                    example: "University of Technology"
                  createdAt:
                    type: string
                    format: date-time
                    example: "2023-06-15T10:30:00.000Z"
                  updatedAt:
                    type: string
                    format: date-time
                    example: "2023-06-15T10:30:00.000Z"
        '409':
          description: College already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "College already exists."
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error: Error message details"
          
  /god/getAllColleges:
