components:
  schemas:
    InterviewExchange:
      type: object
      properties:
        id:
          type: string
        interview_ins_ref:
          type: string
        question:
          type: string
        code:
          type: string
          description: Code snippet for coding questions
        response:
          type: string
        feedback:
          type: string
        marks:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          
    Interview:
      type: object
      properties:
        id:
          type: string
        collage_id:
          type: string
        name:
          type: string
        subject:
          type: string
        topic:
          type: string
        no_of_questions:
          type: integer
        no_of_coding_questions:
          type: integer
        status:
          type: string
          enum: [active, paused, scheduled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          
    InterviewInstance:
      type: object
      properties:
        id:
          type: string
        student_roll:
          type: string
        interview_ref:
          type: string
        marks:
          type: number
        feedback:
          type: object
          properties:
            strengths:
              type: string
            weaknesses:
              type: string
            summary:
              type: string
        violation:
          type: integer
        ip:
          type: string
        boolIpChange:
          type: boolean
        status:
          type: string
          enum: [submitted, not submitted]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          
    Student:
      type: object
      properties:
        roll_number:
          type: string
        username:
          type: string
        year:
          type: integer
        semester:
          type: integer
        department_id:
          type: string
        section:
          type: string
        college_id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time