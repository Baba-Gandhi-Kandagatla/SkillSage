            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
        '500':
          description: Internal server error
          
  /god/deleteCollege/{id}:
    delete:
      summary: Delete a college
      description: Removes a college and all its associated data from the system.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: College deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: College not found
        '500':
          description: Internal server error
          
  /god/updateCollege:
