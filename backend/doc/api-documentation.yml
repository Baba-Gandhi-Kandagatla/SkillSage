                        example: "admin123"
                      username:
                        type: string
                        example: "Admin User"
                      college_id:
                        type: string
                        example: "5"
                      createdAt:
                        type: string
                        format: date-time
                        example: "2023-06-20T09:45:00.000Z"
                      updatedAt:
                        type: string
                        format: date-time
                        example: "2023-06-20T09:45:00.000Z"
        '404':
