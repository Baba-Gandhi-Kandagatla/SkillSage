openapi: 3.0.0
info:
  title: SkillSage API
  description: API documentation for SkillSage backend services.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
paths:
  /login:
    post:
      summary: Login to the system
      description: Authenticates users (students or admins) with roll number and password. Returns a JWT token as a signed cookie and user information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rollNumber
                - password
              properties:
                rollNumber:
                  type: string
                  description: Roll number of the user
                  example: "123456"
                password:
                  type: string
                  description: User's password
                  example: "password123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  rollNumber:
                    type: string
                    example: "123456"
                  username:
                    type: string
                    example: "John Doe"
                  role:
                    type: string
                    enum: [student, admin]
                    example: "student"
                  message:
                    type: string
                    example: "Login successful"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid credentials."
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User not found."
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error."
          
  /logout:
    get:
      summary: Logout from the system
      description: Clears the authentication cookie and ends the user session.
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logout successful"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error."
          
  /auth_status:
    get:
      summary: Check authentication status
      description: Verifies if the user is currently authenticated by validating the JWT token. Returns user role and basic information.
      responses:
        '200':
          description: User is authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  rollNumber:
                    type: string
                    example: "123456"
                  role:
                    type: string
                    enum: [student, admin]
                    example: "student"
                  username:
                    type: string
                    example: "John Doe"
        '401':
          description: User not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User not found."
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error."
          
  /student/profile:
    get:
      summary: Get student profile
      description: Retrieves detailed student profile information including personal data, department, college, and evaluation metrics.
      responses:
        '200':
          description: Successfully retrieved profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      roll_number:
                        type: string
                      username:
                        type: string
                      year:
                        type: integer
                      semester:
                        type: integer
                      department_id:
                        type: string
                      section:
                        type: string
                      college_id:
                        type: string
                      Department:
                        type: object
                        properties:
                          name:
                            type: string
                      College:
                        type: object
                        properties:
                          name:
                            type: string
                      EvalMetric:
                        type: object
                  resume:
                    type: string
        '404':
          description: Student not found
        '500':
          description: Server error
          
  /student/get_resume:
    get:
      summary: Get student resume
      description: Returns the student's resume in base64 format along with the processed resume context.
      responses:
        '200':
          description: Successfully retrieved resume
          content:
            application/json:
              schema:
                type: object
                properties:
                  resume:
                    type: string
                    format: base64
                    description: Base64 encoded resume file
                  resume_context:
                    type: string
                    description: Processed resume text
        '404':
          description: Resume not found
        '500':
          description: Server error
          
  /student/upload_resume:
    post:
      summary: Upload a resume
      description: Accepts PDF or DOC/DOCX files, extracts text content, generates a summary, evaluates skills, and stores both the file and extracted information.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - resume
              properties:
                resume:
                  type: string
                  format: binary
                  description: Resume file (PDF, DOC, or DOCX)
      responses:
        '200':
          description: Successfully uploaded resume
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Resume uploaded and saved successfully."
        '400':
          description: No file uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "No file uploaded."
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error."
          
  /student/change_password:
    post:
      summary: Change student password
      description: Allows students to change their password by providing old and new passwords. Verifies old password before updating.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  example: "oldPass123"
                newPassword:
                  type: string
                  example: "newPass456"
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password changed successfully."
        '401':
          description: Invalid old password
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid old password."
        '404':
          description: Student not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User not found."
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error."
          
  /student/get_interviews:
    get:
      summary: Get all interviews for student
      description: Returns all interviews available to the student based on their department, including active, scheduled, and paused interviews sorted by status.
      responses:
        '200':
          description: Successfully retrieved interviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  interviews:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        subject:
                          type: string
                        topic:
                          type: string
                        status:
                          type: string
                        no_of_questions:
                          type: integer
                        no_of_coding_questions:
                          type: integer
                        InterviewInstances:
                          type: array
                          items:
                            type: object
        '500':
          description: Server error
          
  /student/get_specific_interviews:
    get:
      summary: Get specific interviews for student
      description: Returns only the submitted interviews for a student, allowing them to view past performance.
      responses:
        '200':
          description: Successfully retrieved interviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  interviews:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        subject:
                          type: string
                        topic:
                          type: string
                        status:
                          type: string
                        InterviewInstances:
                          type: array
                          items:
                            type: object
        '500':
          description: Server error
          
  /student/get_interview_result/{id}:
    get:
      summary: Get interview result
      description: Retrieves detailed results of a completed interview including all question exchanges and final feedback.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID of the interview
      responses:
        '200':
          description: Successfully retrieved interview result
          content:
            application/json:
              schema:
                type: object
                properties:
                  interviewData:
                    type: object
                    properties:
                      id:
                        type: string
                      student_roll:
                        type: string
                      interview_ref:
                        type: string
                      marks:
                        type: number
                      feedback:
                        type: object
                      status:
                        type: string
                  InterviewExchange:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        interview_ins_ref:
                          type: string
                        question:
                          type: string
                        code:
                          type: string
                        response:
                          type: string
                        feedback:
                          type: string
                        marks:
                          type: number
        '404':
          description: Interview not found
        '500':
          description: Server error
          
  /student/submit_feedback:
    post:
      summary: Submit feedback for an interview
      description: Allows students to submit feedback about their interview experience for system improvement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - interviewId
                - feedbackText
              properties:
                interviewId:
                  type: string
                  description: ID of the interview
                  example: "12345"
                feedbackText:
                  type: string
                  description: Feedback from student
                  example: "The interview questions were well structured and relevant."
      responses:
        '200':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Feedback submitted successfully."
        '404':
          description: Student not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User not found."
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error."
          
  /student/get_feedback:
    get:
      summary: Get feedback for student
      description: Retrieves all feedback submitted by the student across interviews.
      responses:
        '200':
          description: Successfully retrieved feedback
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        roll_number:
                          type: string
                        interview_id:
                          type: string
                        feedback_text:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
        '404':
          description: Student not found
        '500':
          description: Server error
          
  /student/get_attendance:
    get:
      summary: Get student attendance
      description: Provides attendance statistics showing the ratio of interviews attended vs total available interviews.
      responses:
        '200':
          description: Successfully retrieved attendance
          content:
            application/json:
              schema:
                type: object
                properties:
                  attendance:
                    type: number
                    description: Ratio of interviews attended (0-1)
        '404':
          description: Student not found
        '500':
          description: Server error
          
  /student/get_marks:
    get:
      summary: Get student marks by interview
      description: Retrieves marks obtained by the student in all interviews they have participated in.
      responses:
        '200':
          description: Successfully retrieved marks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    marks:
                      type: number
                    interview_ref:
                      type: string
                    Interview:
                      type: object
                      properties:
                        name:
                          type: string
        '404':
          description: Student not found
        '500':
          description: Server error
          
  /student/get_eval_metrics:
    get:
      summary: Get evaluation metrics for student
      description: Returns comprehensive evaluation metrics including skill assessments, problem-solving abilities, and interview performance data.
      responses:
        '200':
          description: Successfully retrieved evaluation metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluationMetrics:
                    type: array
                    items:
                      type: object
                      properties:
                        roll_number:
                          type: string
                        problem_solving:
                          type: number
                        code_quality:
                          type: number
                        debugging:
                          type: number
                        count:
                          type: integer
                        skills:
                          type: object
                  interviewInstancesMarks:
                    type: array
                    items:
                      type: object
                      properties:
                        marks:
                          type: number
                        interview_ref:
                          type: string
                        Interview:
                          type: object
                          properties:
                            name:
                              type: string
        '404':
          description: Student not found
        '500':
          description: Server error
          
  /admin/add_students:
    post:
      summary: Add multiple students via file upload
      description: Bulk imports students from an Excel file, processes student data, assigns departments, and creates accounts with default passwords.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - studentsFile
                - year
              properties:
                studentsFile:
                  type: string
                  format: binary
                  description: Excel file with student data (columns should include rollnumber, name, department)
                year:
                  type: string
                  description: Year of admission
                  example: "2023"
      responses:
        '201':
          description: Students added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Students added successfully."
        '400':
          description: Invalid file format
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid file format."
        '404':
          description: Admin not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Admin not found."
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error."
          
  /admin/getDefaultPassword:
    get:
      summary: Get default password for the college
      description: Retrieves the default password set for new student accounts in the admin's college.
      responses:
        '200':
          description: Successfully retrieved default password
          content:
            application/json:
              schema:
                type: object
                properties:
                  defaultPassword:
                    type: string
        '500':
          description: Internal server error
          
  /admin/setDefaultPassword:
    post:
      summary: Set default password for the college
      description: Updates the default password for the college and resets all student passwords to this new default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
                  description: New default password
                  example: "newDefaultPass123"
      responses:
        '200':
          description: Default password set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password updated successfully."
        '404':
          description: Admin or college not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Admin not found."
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error."
          
  /admin/add_student:
    post:
      summary: Add a new student to the system
      description: Creates a single student account with specified details including name, roll number, year, and department.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rollnumber
                - name
                - year
                - department_name
              properties:
                rollnumber:
                  type: string
                  example: "ST123456"
                name:
                  type: string
                  example: "Jane Smith"
                year:
                  type: integer
                  example: 2
                department_name:
                  type: string
                  example: "Computer Science"
      responses:
        '201':
          description: Student added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Student added successfully."
        '409':
          description: Student already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Student already exists."
        '404':
          description: Department not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Department not found."
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error."
          
  /admin/students/{rollnumber}:
    delete:
      summary: Delete a student
      description: Removes a student account from the system using their roll number.
      parameters:
        - in: path
          name: rollnumber
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Student deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Student not found
        '500':
          description: Internal server error
          
  /admin/update_student/{rollnumber}:
    put:
      summary: Update student details
      description: Modifies student information such as name, year, or department.
      parameters:
        - in: path
          name: rollnumber
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                year:
                  type: integer
                semester:
                  type: integer
                department_id:
                  type: string
                section:
                  type: string
      responses:
        '200':
          description: Student updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Student not found
        '500':
          description: Internal server error
          
  /admin/get_department/{id}:
    get:
      summary: Get department details
      description: Retrieves information about a specific department by its ID.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved department
          content:
            application/json:
              schema:
                type: string
                description: Department name
        '404':
          description: Department not found
        '500':
          description: Internal server error
          
  /admin/get_students:
    get:
      summary: Get all students
      description: Returns a list of all students in the admin's college, with optional filtering by year.
      parameters:
        - in: query
          name: year
          required: false
          schema:
            type: integer
          description: Filter students by academic year
      responses:
        '200':
          description: Successfully retrieved students
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    roll_number:
                      type: string
                    username:
                      type: string
                    year:
                      type: integer
                    department_id:
                      type: string
        '500':
          description: Internal server error
          
  /admin/add_department:
    post:
      summary: Add a new department
      description: Creates a new department in the admin's college with the specified name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Department name
                  example: "Electrical Engineering"
      responses:
        '201':
          description: Department added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "5"
                  name:
                    type: string
                    example: "Electrical Engineering"
                  college_id:
                    type: string
                    example: "3"
                  createdAt:
                    type: string
                    format: date-time
                    example: "2023-05-20T14:32:21.123Z"
                  updatedAt:
                    type: string
                    format: date-time
                    example: "2023-05-20T14:32:21.123Z"
        '409':
          description: Department already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Department already exists."
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error."
          
  /admin/delete_department/{department_name}:
    delete:
      summary: Delete a department
      description: Removes a department and optionally all students belonging to that department.
      parameters:
        - in: path
          name: department_name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Department deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: Department not found
        '500':
          description: Internal server error
          
  /admin/get_all_departments:
    get:
      summary: Get all departments
      description: Lists all departments in the admin's college.
      responses:
        '200':
          description: Successfully retrieved departments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    college_id:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
        '500':
          description: Internal server error
          
  /admin/create_interview:
    post:
      summary: Create a new interview
      description: Creates a new interview with specified name, subject, topic, number of questions, and assigns it to one or more departments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - subject
                - topic
                - departments
              properties:
                name:
                  type: string
                  description: Interview name
                  example: "React Advanced Interview"
                subject:
                  type: string
                  description: Subject of the interview
                  example: "Web Development"
                topic:
                  type: array
                  items:
                    type: string
                  description: Topics covered in the interview
                  example: ["React Hooks", "State Management", "Component Lifecycle"]
                no_of_questions:
                  type: integer
                  description: Number of regular questions
                  default: 5
                  example: 5
                no_of_coding_questions:
                  type: integer
                  description: Number of coding questions
                  default: 1
                  example: 2
                departments:
                  type: array
                  items:
                    type: string
                  description: Department names to assign interview to
                  example: ["Computer Science", "Information Technology"]
      responses:
        '201':
          description: Interview created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Interview created successfully."
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid input: Missing or incorrect fields."
        '404':
          description: Department not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "One or more departments not found."
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Internal server error."
          
  /admin/get_interviews:
    get:
      summary: Get all interviews
      description: Retrieves all interviews created in the admin's college along with their assigned departments.
      responses:
        '200':
          description: Successfully retrieved interviews
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    collage_id:
                      type: string
                    name:
                      type: string
                    subject:
                      type: string
                    topic:
